<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorace | Official Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap');

        body {
            background: linear-gradient(135deg, #012C6D 0%, #0345a3 50%, #012C6D 100%) !important;
            background-size: 300% 300%;
            animation: festiveGradient 10s ease infinite;
            font-family: 'Nunito', sans-serif;
            color: #333;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes festiveGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Fixed Festive Star Pattern Overlay */
        body::before {
            content: '✨  🎉  ✨  🎈  ✨  🎊  ✨  🌟';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 28px;
            color: rgba(255, 209, 0, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-content: space-evenly;
            line-height: 180px;
            letter-spacing: 120px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Baloo 2', cursive;
            font-weight: 800;
        }

        .merdeka-title {
            color: #FFD100;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 0 #d96a00, 0 0 15px rgba(255, 209, 0, 0.6), 2px 2px 5px rgba(0, 0, 0, 0.5);
            animation: bouncePulse 2s infinite alternate cubic-bezier(0.68, -0.55, 0.265, 1.55);
            margin-bottom: 5px;
        }

        @keyframes bouncePulse {
            0% {
                transform: scale(1) rotate(-1deg);
                text-shadow: 0 4px 0 #d96a00, 0 0 15px rgba(255, 209, 0, 0.4);
            }

            100% {
                transform: scale(1.05) rotate(1deg);
                text-shadow: 0 4px 0 #d96a00, 0 0 25px rgba(255, 209, 0, 0.8);
            }
        }

        .merdeka-subtitle {
            color: #fff;
            letter-spacing: 1px;
            font-weight: 700;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .merdeka-card {
            background-color: #ffffff;
            border: 4px solid #FFD100;
            border-radius: 28px;
            box-shadow: 0 12px 0 rgba(1, 44, 109, 0.4), 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            position: relative;
            overflow: visible;
            margin-bottom: 40px;
        }

        .merdeka-card::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            height: 12px;
            background: #ED1C24;
            border-radius: 24px 24px 0 0;
            z-index: 0;
        }

        .merdeka-card .card-body {
            position: relative;
            z-index: 1;
        }

        @keyframes bounceIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .jpp-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.4));
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0% {
                transform: translateY(0) rotate(-2deg);
                filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.4));
            }

            50% {
                transform: translateY(-12px) rotate(2deg);
                filter: drop-shadow(0px 15px 15px rgba(0, 0, 0, 0.3));
            }

            100% {
                transform: translateY(0) rotate(-2deg);
                filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.4));
            }
        }

        .header-badge {
            display: inline-block;
            background: #FFD100;
            color: #012C6D;
            padding: 6px 16px;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transform: rotate(-2deg);
        }

        .btn-merdeka {
            background: #ED1C24;
            color: white;
            font-family: 'Baloo 2', cursive;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            padding: 10px 20px;
            box-shadow: 0 6px 0 #a00b11;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-merdeka:hover {
            background: #ff2a33;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #a00b11;
        }

        .btn-merdeka:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a00b11;
        }
    </style>
</head>

<body class="bg-light py-5">

    <div class="container" style="max-width: 900px;">

        <!-- Themed Header -->
        <div class="text-center mb-4">
            <img src="LOGO JPP PMTG (1).jpg" alt="JPP Logo" class="jpp-logo mb-3">
            <h1 class="merdeka-title display-5 fw-bold">🏆 MERDEKA EXPLORACE 🇲🇾</h1>
            <p class="merdeka-subtitle text-uppercase">📍 Official Event Map 📍</p>
        </div>

        <!-- Map Card -->
        <div class="card merdeka-card">
            <div class="card-body p-4 text-center">
                <div class="header-badge">🗺️ Route & Checkpoints</div>

                <!-- Map Image -->
                <div class="mt-3 mb-4">
                    <img src="explorace-map.png" alt="Explorace Route Map"
                        class="img-fluid rounded border border-3 w-100 shadow-sm"
                        style="border-color: #FFD100 !important; background-color: #f8fafc;">
                </div>

                <!-- Navigation Button -->
                <a href="leaderboard.html" class="btn btn-merdeka">🏆 View Live Leaderboard</a>
            </div>
        </div>

    </div>

</body>

</html>
